name: Adicionar depoimento

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Nome do cliente (como aparece no Google)"
        required: true
      estrelas:
        description: "Estrelas (1 a 5)"
        default: "5"
        required: true
      texto:
        description: "Texto da avaliação (deixe vazio se só tem estrelas)"
        required: false
      cargo:
        description: "Local e serviço (ex.: Avaliação no Google)"
        required: false
      data:
        description: "Mês da avaliação (AAAA-MM, ex.: 2026-10)"
        required: false
      idioma:
        description: "Idioma do texto (pt ou en)"
        default: "pt"
        required: false
      fonte:
        description: "Origem da avaliação"
        type: choice
        options:
          - google
          - outro
        default: google

permissions:
  contents: write

jobs:
  adicionar:
    uses: PauloFOJr/reviews-kit/.github/workflows/add-review.yml@v1
    with:
      nome: ${{ inputs.nome }}
      estrelas: ${{ inputs.estrelas }}
      texto: ${{ inputs.texto }}
      cargo: ${{ inputs.cargo }}
      data: ${{ inputs.data }}
      idioma: ${{ inputs.idioma }}
      fonte: ${{ inputs.fonte }}
      json_path: reviews.json
      html_path: index.html
      layout: list
